<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">FLICK | A film journal, in your own words.</title>
  <desc id="description">감정으로 발견하고 나만의 언어로 기록하는 영화 저널. 오른쪽은 공개 웹 베타의 취향 선택 화면입니다.</desc>
  <defs><clipPath id="screen"><rect x="708" y="26" width="440" height="402" rx="8"/></clipPath></defs>
  <rect width="1200" height="520" fill="#FFF2F5"/>
  <g font-family="Segoe UI,Malgun Gothic,Arial,sans-serif" letter-spacing="0">
    <path d="M52 49H80" stroke="#E82E50" stroke-width="4"/>
    <text x="92" y="55" font-size="15" font-weight="600" fill="#B6203C">02 / PERSONAL FILM JOURNAL</text>
    <text x="46" y="178" font-size="116" font-weight="800" fill="#E82E50">FLICK</text>
    <text x="52" y="237" font-size="29" font-weight="700" fill="#28232A">영화는 끝나도, 감상은 남도록.</text>
    <text x="52" y="284" font-size="20" fill="#63545E">감정으로 발견하고 나만의 언어로 기록하는</text>
    <text x="52" y="315" font-size="20" fill="#63545E">영화 저널과 취향 아카이브</text>
    <path d="M52 349H648" stroke="#E8BBC6"/>
    <text x="52" y="388" font-size="20" font-weight="700" fill="#B6203C">DISCOVER / LIGHT &amp; CORE / REDISCOVER</text>
    <text x="52" y="418" font-size="15" fill="#63545E">A film journal, in your own words.</text>
    <rect x="690" width="510" height="454" fill="#F9DCE3"/>
    <image href="./product-onboarding.png" x="708" y="26" width="440" height="402" preserveAspectRatio="xMidYMin slice" clip-path="url(#screen)"/>
    <rect y="454" width="1200" height="66" fill="#E82E50"/>
    <text x="52" y="495" font-size="18" font-weight="600" fill="#FFFFFF">HOYA / PRODUCT &amp; ENGINEERING</text>
    <text x="1148" y="495" text-anchor="end" font-size="18" fill="#FFFFFF">WEB BETA · DEMO SCREEN</text>
  </g>
