<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">FLICK</title>
  <desc id="desc">감정 키워드로 영화를 발견하고 감상을 기록하는 모바일 영화 저널</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15171A"/>
      <stop offset="0.58" stop-color="#24272D"/>
      <stop offset="1" stop-color="#3A151D"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F2233C" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#F2233C" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="500" rx="34" fill="url(#background)"/>
  <circle cx="1030" cy="72" r="310" fill="url(#glow)"/>
  <circle cx="170" cy="470" r="250" fill="url(#glow)" opacity="0.55"/>

  <g opacity="0.11" fill="none" stroke="#FFFFFF">
    <circle cx="1045" cy="240" r="155"/>
    <circle cx="1045" cy="240" r="117"/>
    <circle cx="1045" cy="240" r="78"/>
    <circle cx="1045" cy="240" r="39"/>
  </g>

  <g transform="translate(94 98)" filter="url(#shadow)">
    <rect width="720" height="304" rx="30" fill="#FFFFFF"/>
    <rect x="42" y="42" width="72" height="72" rx="22" fill="#FFF0F3"/>
    <g transform="translate(78 78)" stroke="#F2233C" stroke-width="8" stroke-linecap="round">
      <path d="M0-22V22"/>
      <path d="M-22 0H22"/>
      <path d="M-16-16L16 16"/>
      <path d="M16-16L-16 16"/>
    </g>

    <text x="138" y="95" fill="#F2233C" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="900" letter-spacing="-2">FLICK</text>
    <text x="44" y="168" fill="#15171A" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="800">오늘의 감정으로 영화를 발견하세요.</text>
    <text x="44" y="211" fill="#69707A" font-family="Arial, Helvetica, sans-serif" font-size="22">감정 기반 영화 발견 · 감상 기록 · 취향 아카이브</text>

    <g transform="translate(44 246)" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">
      <rect width="116" height="38" rx="19" fill="#FFF0F3"/>
      <text x="58" y="25" text-anchor="middle" fill="#F2233C">몰입감 있는</text>
      <rect x="128" width="86" height="38" rx="19" fill="#FFF4E5"/>
      <text x="171" y="25" text-anchor="middle" fill="#A65C00">따뜻한</text>
      <rect x="226" width="144" height="38" rx="19" fill="#EAF8F2"/>
      <text x="298" y="25" text-anchor="middle" fill="#117A55">생각이 깊어지는</text>
    </g>
  </g>

  <g transform="translate(900 123) rotate(7)" filter="url(#shadow)">
    <rect width="205" height="286" rx="24" fill="#FFFFFF"/>
    <rect x="17" y="17" width="171" height="190" rx="16" fill="#F2233C"/>
    <circle cx="102.5" cy="95" r="48" fill="none" stroke="#FFFFFF" stroke-width="9" opacity="0.92"/>
    <circle cx="102.5" cy="95" r="12" fill="#FFFFFF"/>
    <path d="M102.5 47V143M54.5 95H150.5M68.5 61L136.5 129M136.5 61L68.5 129" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.42"/>
    <text x="24" y="239" fill="#15171A" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800">다음 영화</text>
    <text x="24" y="266" fill="#69707A" font-family="Arial, Helvetica, sans-serif" font-size="15">지금 마음에 맞게</text>
  </g>
</svg>
